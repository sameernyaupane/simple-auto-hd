<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Simple Auto HD</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<header class="header">
		<img src="icons/sahd-128.png" alt="" class="header__logo">
		<div class="header__text">
			<h1 class="header__name">Simple Auto HD</h1>
			<span class="header__version"></span>
		</div>
	</header>

	<div class="card card--master">
		<label class="row__label" for="extension-enabled">
			<span class="row__title" id="extension-status">Enabled</span>
		</label>
		<label class="switch">
			<input type="checkbox" id="extension-enabled">
			<span class="switch__track"></span>
		</label>
	</div>

	<div class="card" id="settings">
		<div class="field">
			<label class="row__title" for="preferred-quality">Preferred quality</label>
			<div class="select-wrap">
				<select id="preferred-quality"></select>
			</div>
		</div>

		<div class="row">
			<label class="row__label" for="allow-premium">
				<span class="row__title">Premium quality</span>
				<span class="row__hint">Enhanced-bitrate streams</span>
			</label>
			<label class="switch">
				<input type="checkbox" id="allow-premium">
				<span class="switch__track"></span>
			</label>
		</div>

		<div class="row">
			<label class="row__label" for="apply-to-shorts">
				<span class="row__title">Apply to Shorts</span>
			</label>
			<label class="switch">
				<input type="checkbox" id="apply-to-shorts">
				<span class="switch__track"></span>
			</label>
		</div>

		<div class="row">
			<label class="row__label" for="theater-mode">
				<span class="row__title">Theater mode</span>
			</label>
			<label class="switch">
				<input type="checkbox" id="theater-mode">
				<span class="switch__track"></span>
			</label>
		</div>
	</div>

	<div class="card">
		<div class="row">
			<span class="row__title">Appearance</span>
			<div class="segmented" role="radiogroup" aria-label="Appearance">
				<input type="radio" name="theme" id="theme-system" value="system">
				<label for="theme-system">Auto</label>
				<input type="radio" name="theme" id="theme-light" value="light">
				<label for="theme-light">Light</label>
				<input type="radio" name="theme" id="theme-dark" value="dark">
				<label for="theme-dark">Dark</label>
			</div>
		</div>
	</div>

	<p class="status" id="status" data-state="idle">
		<span class="status__dot"></span>
		<span class="status__text">Checking…</span>
	</p>

	<footer class="footer">
		<a class="footer__link" href="https://github.com/sameernyaupane/simple-auto-hd" target="_blank" rel="noopener">
			<svg class="footer__icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
			<span>Source</span>
		</a>
		<a class="footer__link" href="https://chromewebstore.google.com/detail/simple-auto-hd-open-sourc/jnofiabkigekemighcdaejlpgdhmbaog" target="_blank" rel="noopener">
			<svg class="footer__icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 11.6 4.12 14l1.03-4.42L1.7 6.6l4.52-.39L8 2.06l1.78 4.15 4.52.39-3.45 2.98L11.88 14z"/></svg>
			<span>Leave a review</span>
		</a>
	</footer>

	<script src="popup.js"></script>
</body>
</html>
